# SeaweedFS FSAL Integration Test Configuration
# This configuration is designed for testing against a local SeaweedFS docker instance

# Global NFS Core Parameters
NFS_Core_Param
{
    # Enable protocols
    Protocols = 3,4;
    
    # NFS Port (use unprivileged port for testing)
    NFS_Port = 20049;
    
    # Bind to localhost only for testing
    Bind_Addr = 127.0.0.1;
    
    # Manage GIDS
    Manage_Gids_Expiration = 3600;
    
    # PID file location (writable by current user)
    Pid_File = "/tmp/ganesha_test.pid";
    
    # Allow IO flusher failure for testing
    allow_set_io_flusher_fail = true;
}

# SeaweedFS FSAL Configuration (MVP mode for integration testing)
FSAL
{
    Name = SEAWEEDFS;
    
    # SeaweedFS Filer endpoint (your docker compose setup)
    filer_endpoints = "127.0.0.1:8333";
    
    # Connection settings for testing
    connection_timeout = 10;
    connection_pool_size = 2;
    max_concurrent_requests = 10;
    
    # Minimal cache for testing
    path_cache_size = 100;
    path_cache_ttl = 60;
    
    # Enable file locks for testing
    enable_file_locks = true;
    default_lock_timeout = 30;
}

# Test Export Definition
EXPORT
{
    # Export ID
    Export_Id = 1;
    
    # Root path in SeaweedFS
    Path = "/";
    
    # NFSv4 pseudo path
    Pseudo = "/seaweed_test";
    
    # Access permissions
    Access_Type = RW;
    
    # No squashing for testing
    Squash = none;
    
    # Security - allow sys auth for testing
    SecType = "sys";
    
    # FSAL configuration
    FSAL
    {
        Name = SEAWEEDFS;
    }
    
    # Allow localhost access for testing  
    CLIENT
    {
        Clients = 127.0.0.1;
        Access_Type = RW;
        Squash = none;
        
        # Test user mapping
        Anonymous_Uid = 1000;
        Anonymous_Gid = 1000;
    }
    
    CLIENT
    {
        Clients = ::1;
        Access_Type = RW;
        Squash = none;
        
        # Test user mapping
        Anonymous_Uid = 1000;
        Anonymous_Gid = 1000;
    }
}

# Verbose logging for testing and debugging
LOG
{
    # Debug level for testing
    Default_Log_Level = DEBUG;
    
    # Component-specific logging
    Components
    {
        FSAL = FULL_DEBUG;
        NFS_V4 = DEBUG;
        #NFS_V3 = DEBUG;
        EXPORT = DEBUG;
        DISPATCH = INFO;
        MDCACHE = DEBUG;
        #RPC = INFO;
        #NFS_CB = DEBUG;
    }
    
    # Log to console and file
    Facility
    {
        name = FILE;
        destination = "/tmp/ganesha_seaweed_test.log";
        enable = active;
    }
}

# NFSv4 Configuration for testing
NFSv4
{
    DomainName = "test.local";
    
    # Use local authentication
    UseGetpwnam = true;
    UseGetgrnam = true;
    
    # Allow numeric owners for testing
    Allow_Numeric_Owners = true;
    Only_Numeric_Owners = false;
    
    # Short grace period for testing
    Graceless = false;
    Lease_Lifetime = 30;
    Grace_Period = 45;
}
